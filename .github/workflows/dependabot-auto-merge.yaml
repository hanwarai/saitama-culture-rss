name: dependabot auto-merge

# SECURITY: pull_request_target は write 権限つきの GITHUB_TOKEN で base ブランチの
# 定義を実行する。したがってこのワークフローでは PR のコードを絶対に checkout / 実行しない。
# ビルドやテストのステップをここに足すと PR 側の任意コードに write token を渡すことになる。
# 検証は ci.yaml (pull_request, read-only トークン) の責務であり、ここは API 呼び出しのみに留める。
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

# Dependabot は rebase のたびに synchronize を投げるので run が重なる。2 本目は
# 「もうマージ済み」で赤くなるだけなので、PR 単位で古い run を畳む。
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'hanwarai/saitama-culture-rss'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # update-type はグループ PR の場合「その PR に含まれる最大の semver 変更」を指す。
      # major を含むグループは自動マージせず手動レビューに残す。
      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh は CLEAN / HAS_HOOKS / UNSTABLE を「即マージ可能」と判断し、--auto を
          # 付けていてもその場でマージする。else に来るのは DIRTY (コンフリクト) や
          # auto-merge 無効、API の一時エラー等。素の merge に落としても --admin を
          # 付けていないので branch protection の required check は効いたままで、
          # 赤い PR は弾かれる。ただしその安全性は workflow 外の設定 (main の
          # required status checks に quality が入っていること) に依存する。
          if err=$(gh pr merge --auto --squash "$PR_URL" 2>&1); then
            echo "${err:-マージまたは auto-merge の有効化に成功した}"
          else
            # 失敗理由を伏せると原因調査ができないので、そのまま出してから再試行する
            echo "::notice::gh pr merge --auto が失敗したため素の merge を試みる: $err"
            gh pr merge --squash "$PR_URL"
          fi

      - name: Report skipped major update
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: echo "::notice::major update ($NAMES) のため自動マージせず手動レビューに残す"
